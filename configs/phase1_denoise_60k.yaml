name: phase1_denoise_60k
model:
  width: 32
  topology: unet
  enc_depths:
  - 2
  - 3
  bottleneck_depth: 4
  dec_depths:
  - 3
  - 2
  refine_depth: 2
  heads:
  - 1
  - 2
  - 4
  window_size: 8
  ffn_expansion: 2.66
  gate_init:
  - 0.8
  - 0.5
  - 0.2
  bias: false
  task: restoration
  scale: 1
  grad_ckpt: false
data:
  kind: gaussian_denoise
  root: data/DIV2K/DIV2K_train_HR_sub
  patch_size: 128
  sigmas:
  - 15
  - 25
  - 50
  repeat: 1
  num_workers: 4
val:
  gt_root: data/test/McMaster
  task: denoise
  sigma: 25
  max_images: 8
  scale: 1
train:
  total_iters: 60000
  effective_batch: 16
  micro_batch: 8
  amp: bf16
  channels_last: false
  lr: 0.0002
  min_lr: 1.0e-06
  warmup_iters: 3000
  weight_decay: 0.0001
  grad_clip: 1.0
  ema: true
  ema_decay: 0.999
  pixel_loss: l1
  w_fft: 0.0
  log_every: 100
  gate_every: 500
  ckpt_every: 1000
  val_every: 2500
  select_metric: psnr
  max_nonfinite_streak: 50
